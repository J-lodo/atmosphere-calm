# Render — repo GitHub "atmosphere-calm" (backend à la racine)
# Root Directory sur Render : laisser VIDE (pas "backend")

services:
  - type: web
    name: atmosphere-app
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
